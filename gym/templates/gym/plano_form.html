{% extends "gym/base.html" %}
{% block title %}Plano de treino - Academia{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{% if object %}Editar plano{% else %}Novo plano{% endif %}</h1>
</div>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{% url 'gym:plano_list' %}" class="btn btn-link">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
