{% extends "gym/base.html" %}
{% block title %}Login - Academia{% endblock %}
{% block content %}
<div class="login-shell">
    <div class="login-card">
        <h1>Entrar</h1>
        <p class="login-sub">Acesse o painel de gestão da academia</p>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">Usuário ou senha inválidos.</div>
            {% endif %}
            <p>
                <label>Usuário</label>
                {{ form.username }}
            </p>
            <p>
                <label>Senha</label>
                {{ form.password }}
            </p>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
